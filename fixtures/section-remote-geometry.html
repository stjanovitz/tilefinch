<!doctype html><html><head><title>Remote geometry</title><style>html,body{margin:0;padding:0}#first-section{height:700px}h1,h2{margin:0}#beta{display:block;width:120px;height:40px}</style><script>setTimeout(()=>{const alpha=document.getElementById('alpha'),beta=document.getElementById('beta'),a=alpha.getBoundingClientRect(),b=beta.getBoundingClientRect(),checks=[Math.round(b.top-a.top)===700,Math.round(b.width)===120,Math.round(b.height)===40,beta.clientWidth===120,beta.clientHeight===40,beta.getClientRects().length===1];document.getElementById('geometry-result').textContent=checks.every(Boolean)?'GEOMETRY-PASS':'GEOMETRY-FAIL:'+checks.map(Number).join('')+':'+[a.top,b.top,b.width,b.height,beta.clientWidth,beta.clientHeight].join(',');},0);</script></head><body><div id="first-section"><h1 id="alpha">Alpha</h1><output id="geometry-result">WAIT</output></div><h2 id="beta">Beta</h2></body></html>
