<!doctype html>
<html>
<head><title>Section property handler state</title></head>
<body>
  <h1 id="alpha">Property handler section</h1>
  <input id="handler-result" value="A">
  <button id="handler-button">Update</button>
  <script>
    document.getElementById('handler-button').onclick = () => {
      const result = document.getElementById('handler-result');
      result.value = result.value + 'B';
    };
  </script>
  <h2 id="gamma">Other section</h2>
  <p>Evict the property handler section.</p>
</body>
</html>
