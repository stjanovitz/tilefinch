# Defaults for a Memory Stick install. Set network_profile to match the
# saved PSP connection you want to use; everything else is optional.
#
# url=      Leave empty to open the built-in start page. Set it to any
#           https:// address to boot straight into that page instead.
# limit_mb= Shared page/voice memory envelope in MiB (12-52). 32 uses the
#           measured PSP-3000 heap while retaining non-browser headroom.
# developer_update_url= Public https:// TFUM metadata link used only after
#           choosing Developer under Options > Experimental > Update channel.
#           It can also be entered on-device under Developer URL; both paths
#           persist the same key in the shared boot override.
#           http:// is refused: this channel's package is unsigned, so
#           cleartext would let anything on the path replace it.
# developer_package_url= Optional separate https:// TFUP package link. Use
#           this for a OneDrive share; empty keeps same-directory lookup.
#           Developer code is unsigned but retains digest/A-B trial checks.
#           No credentials are read or sent. An unusable value here is
#           ignored with a log line and simply hides the channel.
url=
developer_update_url=
developer_package_url=
trace=none
profile=realistic
network_profile=1
limit_mb=32
ticks=0
dump_frame=0
