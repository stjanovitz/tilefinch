<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>YouTube video lab</title>
    <style>
      html,
      body {
        background: #0f0f0f;
        color: #f1f1f1;
        margin: 0;
        min-height: 100%;
      }

      main {
        padding: 8px;
      }

      h1 {
        font-size: 15px;
        font-weight: 600;
        line-height: 20px;
        margin: 0 0 6px;
      }

      video {
        background: #000;
        display: block;
        height: 240px;
        margin: 0 auto;
        object-fit: contain;
        width: 320px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Fixture video — YouTube format 18</h1>
      <video autoplay controls width="320" height="240"></video>
    </main>
  </body>
</html>
